version: '3.8'

services:
  web:
    build: .
    ports:
      - '3000:3000'
    volumes:
      - ./service:/service
      - tmp-data:/service/tmp
    environment:
      - RAILS_ENV=development
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -p 3000 -b '0.0.0.0'"

volumes:
  tmp-data:
